# Sends AUN notices outside the app (daily e-mail summary, Telegram alerts).
# Runs every 5 minutes (GitHub may delay scheduled runs a few minutes).
# Secrets: FIREBASE_SERVICE_ACCOUNT, TELEGRAM_BOT_TOKEN, GMAIL_USER, GMAIL_APP_PASSWORD
# (see docs/NOTIFICACIONES.md). Without FIREBASE_SERVICE_ACCOUNT it does nothing.
name: Notifier

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notifier

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifier/package-lock.json

      - run: npm ci --omit=dev

      - name: Send notices
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node run.mjs
