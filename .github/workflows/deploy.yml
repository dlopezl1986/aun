# Deploy AUN to GitHub Pages on every push to main.
# Firebase config comes from repository secrets → environment variables.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Never publish a build without the cloud backend: it would silently
      # fall back to per-browser local accounts.
      - name: Check Firebase config
        env:
          API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$PROJECT_ID" ] || [ -z "$APP_ID" ]; then
            echo "::error::Faltan los secrets FIREBASE_* del repositorio (ver docs/DEPLOY.md)"
            exit 1
          fi

      - run: npm ci

      # GitHub Pages serves the app from /<repo-name>/ — set the base path
      # so Expo Router generates correct asset URLs and routing.
      - name: Set base path for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          node -e "
            const f = require('./app.json');
            f.expo.experiments = { ...f.expo.experiments, baseUrl: '/${REPO_NAME}' };
            require('fs').writeFileSync('app.json', JSON.stringify(f, null, 2) + '\n');
          "
          echo "Base URL set to /$REPO_NAME"

      - name: Build web export
        env:
          # Firebase public config (from repository secrets).
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npx expo export --platform web

      # SPA: copy index.html to 404.html so client-side routing works.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
