# Manual, read-only diagnosis of family sharing (anonymised counts only).
name: Diagnose sharing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notifier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifier/package-lock.json
      - run: npm ci --omit=dev
      - name: Diagnose
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node diagnose.mjs
